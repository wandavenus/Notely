name: Tes Unit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Jalankan tes unit
        run: ./gradlew :app:testDebugUnitTest --stacktrace
