name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tes unit
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build APK rilis (minify + R8 + shrink)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Unggah APK sebagai artefak Actions
        uses: actions/upload-artifact@v4
        with:
          name: notely-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Siapkan nama rilis
        id: rilis
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "notely-v$VERSION-arm64-v8a.apk"

      - name: Unggah APK ke GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rilis.outputs.tag }}"
          FILE="notely-${TAG}-arm64-v8a.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Notely $TAG" \
              --notes "Rilisan otomatis dari GitHub Actions. APK rilis arm64-v8a (minify + R8 + shrinkResources aktif, ditandatangani kunci debug agar langsung bisa dipasang)."
          fi
