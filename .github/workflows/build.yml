name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Siapkan keystore rilis
        env:
          NOTELY_KEYSTORE_BASE64: ${{ secrets.NOTELY_KEYSTORE_BASE64 }}
        run: echo "$NOTELY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notely-release.jks"

      - name: Build APK rilis (minify + R8 + shrink)
        env:
          NOTELY_KEYSTORE_FILE: ${{ runner.temp }}/notely-release.jks
          NOTELY_KEYSTORE_PASSWORD: ${{ secrets.NOTELY_KEYSTORE_PASSWORD }}
          NOTELY_KEY_ALIAS: ${{ secrets.NOTELY_KEY_ALIAS }}
          NOTELY_KEY_PASSWORD: ${{ secrets.NOTELY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Siapkan nama rilis
        id: rilis
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "notely-v$VERSION-arm64-v8a.apk"

      - name: Unggah APK ke GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.rilis.outputs.tag }}"
          FILE="notely-${TAG}-arm64-v8a.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Notely $TAG" \
              --notes "Rilisan otomatis dari GitHub Actions. APK rilis arm64-v8a (minify + R8 + shrinkResources aktif, ditandatangani kunci rilis Notely)."
          fi
